name: Flask 2.0

on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - app/**
      - .github/workflows/**

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review

permissions:
  id-token: write
  contents: read
    
env:
  APPLICATION_NAME: python-app
  DOCKER_USERNAME: shreepalsingh
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  flask-build-test-publish-job:
    runs-on: ubuntu-latest

    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'feature/')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && !contains(github.event.pull_request.title, 'WIP')) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name flask-container \
            $DOCKER_USERNAME/$APPLICATION_NAME:$IMAGE_TAG

      - name: Smoke Test Application
        run: |
          sleep 5
          curl  http://localhost:5000
          curl  http://localhost:5000/health

      - name: Push Docker Image To DockerHub
        if: ${{ success() }}
        run: |
          docker push $DOCKER_USERNAME/$APPLICATION_NAME:$IMAGE_TAG

      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs flask-container

      - name: Cleanup Containers
        if: ${{ always() }}
        run: |
          docker rm -f flask-container || true

  terraform:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4

        - uses: hashicorp/setup-terraform@v3

        - name: Terraform Init
          run: terraform init

        - name: Terraform Plan
          run: terraform plan -auto-approve -var-file="dev.tfvars"

        - name: Terraform Apply
          run: terraform apply -auto-approve -var-file="dev.tfvars"



